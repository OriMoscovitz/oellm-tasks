task: cus_qa_text_sk_en
dataset_path: ufal/cus-qa
dataset_name: text-SK
test_split: dev
output_type: generate_until
description: "You are an experienced trivia game contestant. Provide a short and correct answer!"
doc_to_text: "{{question_en}}"
doc_to_target: "{{answer_en}}"
generation_kwargs:
  until:
    - "\n"
  max_gen_toks: 128
metric_list:
  - metric: bleu
    higher_is_better: true
  - metric: chrf
    higher_is_better: true
